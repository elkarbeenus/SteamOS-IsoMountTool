name: Build, test & release

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    if: ${{ !startsWith(github.ref, 'refs/heads/ci-screenshots') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin file xvfb \
            libegl1 libgl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-xfixes0 libxcb-xkb1 fonts-dejavu-core
          sudo apt-get remove -y libxcb-cursor0 || true

      - name: Unit tests (core logic)
        run: python3 -m unittest discover -s tests -v

      - name: Build AppImage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./build.sh

      - name: Smoke test
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./dist/*.AppImage --version
          ./dist/*.AppImage --list
          ./dist/*.AppImage --list-proton

      - name: Screenshots (offscreen + real X11 via Xvfb)
        run: |
          mkdir -p shots
          export APPIMAGE_EXTRACT_AND_RUN=1
          QT_QPA_PLATFORM=offscreen ./dist/*.AppImage --screenshots shots/offscreen > shots/log-offscreen.txt 2>&1 || touch shots/FAILED
          xvfb-run -a -s "-screen 0 1400x900x24" env QT_QPA_PLATFORM=xcb ./dist/*.AppImage --screenshots shots/xcb > shots/log-xcb.txt 2>&1 || touch shots/FAILED
          ls -la dist > shots/dist.txt
          cat shots/log-*.txt

      - name: Publish screenshots to branch ci-screenshots
        if: always() && github.ref != 'refs/heads/main'
        run: |
          mkdir -p shots
          rm -rf /tmp/pub && mkdir /tmp/pub && cp -r shots/. /tmp/pub/
          echo "${GITHUB_SHA}" > /tmp/pub/COMMIT
          cd /tmp/pub
          git init -q && git checkout -q -b ci-screenshots && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots

      - name: Fail if screenshots failed
        run: test ! -e shots/FAILED

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppImage
          path: dist/*.AppImage

  windows:
    if: ${{ !startsWith(github.ref, 'refs/heads/ci-screenshots') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check "PySide6-Essentials~=6.8.0" pyinstaller pillow

      - name: Build .exe (PyInstaller)
        shell: bash
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          mkdir -p build
          python packaging/make_ico.py build/icon.ico
          cp VERSION src/isomounttool/VERSION
          cp packaging/steamos-isomounttool.svg src/isomounttool/icon.svg
          python -m PyInstaller --noconfirm --clean --onefile --windowed \
            --name "SteamOS-IsoMountTool-$v-windows-x64" --icon build/icon.ico \
            --paths src --collect-submodules isomounttool \
            --add-data "src/isomounttool/VERSION;isomounttool" \
            --add-data "src/isomounttool/icon.svg;isomounttool" \
            --exclude-module tkinter \
            src/steamos-isomounttool.py
          ls -la dist

      - name: Screenshots (offscreen)
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dist\*.exe | Select-Object -First 1).FullName
          $env:QT_QPA_PLATFORM = 'offscreen'
          $p = Start-Process -FilePath $exe -ArgumentList '--screenshots', "$PWD\shots-win" -Wait -PassThru
          Get-Content shots-win\errors.txt
          Get-ChildItem shots-win
          if ($p.ExitCode -ne 0) { New-Item shots-win\FAILED -ItemType File | Out-Null }

      - name: Publish screenshots to branch ci-screenshots-win
        if: always() && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          mkdir -p shots-win
          rm -rf ../pub && mkdir ../pub && cp -r shots-win/. ../pub/
          echo "${GITHUB_SHA}" > ../pub/COMMIT
          ls -la dist > ../pub/dist.txt || true
          cd ../pub
          git init -q && git checkout -q -b ci-screenshots-win && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Windows screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots-win

      - name: Fail if screenshots failed
        shell: bash
        run: test ! -e shots-win/FAILED

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowsExe
          path: dist/*.exe

  release:
    if: github.ref == 'refs/heads/main'
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release (when VERSION has no release yet)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          v="$(tr -d '[:space:]' < VERSION)"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$v already exists – nothing to publish."; exit 0
          fi
          {
            echo "## SteamOS ISO Mount Tool $v"
            echo
            awk -v v="$v" '/^## \[/{ f = (index($0, "[" v "]") > 0); next } f' CHANGELOG.md
            echo
            echo "### Downloads"
            echo "| System | File |"
            echo "|---|---|"
            echo "| SteamOS / Linux | \`SteamOS-IsoMountTool-$v-x86_64.AppImage\` |"
            echo "| Windows 10 / 11 (64-bit) | \`SteamOS-IsoMountTool-$v-windows-x64.exe\` |"
            echo
            echo "### Installation"
            echo "**SteamOS / Linux:** download the AppImage → right-click → Properties → Permissions → **Is executable** → double-click."
            echo
            echo "**Windows:** download the .exe and double-click it – no installation needed. (Windows SmartScreen may warn because the file is not signed: *More info* → *Run anyway*.)"
            echo
            echo "Already installed? The tool offers this update automatically on its next start."
            echo
            echo "*Created by Dominic Lesina x Claude*"
          } > release-notes.md
          cat release-notes.md
          gh release create "v$v" dist/*.AppImage dist/*.exe --target "$GITHUB_SHA" --title "v$v" --notes-file release-notes.md
