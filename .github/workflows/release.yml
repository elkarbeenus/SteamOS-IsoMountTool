name: Build & Release AppImage

on:
  push:
    branches: [main]
    paths: ['VERSION', 'CHANGELOG.md', 'src/**', 'packaging/**', 'build.sh', '.github/workflows/release.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin file

      - name: Determine version / skip if already released
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$v already exists – nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Syntax check
        run: bash -n src/steamos-isomounttool

      - name: Build AppImage
        run: ./build.sh

      - name: Smoke test
        run: APPIMAGE_EXTRACT_AND_RUN=1 ./dist/*.AppImage --version

      - name: Release notes from CHANGELOG
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          {
            echo "## SteamOS ISO Mount Tool $v"
            echo
            awk -v v="$v" '/^## \[/{ f = (index($0, "[" v "]") > 0); next } f' CHANGELOG.md
            echo
            echo "### Installation"
            echo "1. Download \`SteamOS-IsoMountTool-$v-x86_64.AppImage\` below"
            echo "2. Right-click → Properties → Permissions → **Is executable**"
            echo "3. Double-click to start"
            echo
            echo "Already installed? The tool offers this update automatically on its next start."
            echo
            echo "*Created by Dominic Lesina x Claude*"
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub release (and tag)
        if: steps.ver.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.ver.outputs.version }}"
          gh release create "v$v" dist/*.AppImage --target "$GITHUB_SHA" \
            --title "v$v" --notes-file release-notes.md

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppImage
          path: dist/*.AppImage
